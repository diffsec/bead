project: tidewater
facts:
  test-cmd: "Run the test suite with `uv run pytest -m 'not slow'`. Tests marked slow hit real S3 and only run in the nightly CI job."
  lint-cmd: "Linting and formatting use ruff only: `uv run ruff check --fix && uv run ruff format`. Black and isort are not used in this repo."
  python-pin: "Python is pinned to 3.11 in .python-version. The Snowflake connector version we pin has no 3.12 wheels, so uv sync fails on 3.12."
  pyarrow-pin: "pyarrow is pinned to 15.0.2 because 16.x changed timestamp unit handling and broke the parquet writer. Do not bump it without the parquet round-trip tests."
  dagster-dev: "Start the local Dagster UI with `uv run dagster dev -p 3070`; it is served at http://localhost:3070."
  minio-local: "Local S3 is MinIO from docker-compose on port 9100 (console on 9101) with credentials tidewater / tidewater123. Set AWS_ENDPOINT_URL=http://localhost:9100 to use it."
  bucket-layout: "Raw vendor files land in s3://tw-raw/<source>/dt=YYYY-MM-DD/. Nothing may write to tw-raw; all outputs go to s3://tw-curated."
  duckdb-local: "The local warehouse is a DuckDB file at data/warehouse.duckdb. Delete it to reset local state; materializing all assets rebuilds it."
  snowflake-creds: "Snowflake auth uses key-pair only via SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER and SNOWFLAKE_PRIVATE_KEY_PATH. Password auth is disabled for the service users."
  asset-naming: "Dagster assets are named <layer>__<source>__<entity>, for example staging__stripe__charges, and live under tidewater/assets/<layer>/<source>/."
  partition-start: "Daily partitions start at 2023-01-01. Backfills for earlier dates fail because the vendor APIs return no data before then."
  flaky-sensor-test: "tests/sensors/test_s3_sensor.py::test_sensor_cursor is flaky because it depends on MinIO list ordering. Rerun it once before debugging."
  deploy: "Staging deploys automatically on merge to main. Production deploys are run by hand with `make deploy ENV=prod TAG=<git-sha>` after the staging run is green."
  owners: "Priya Nair owns the ingestion layer (tidewater/assets/raw). Tomasz Kowal owns the dbt models and the Snowflake schemas."
  dbt-run: "dbt models live in transform/. To run them without Dagster use `uv run dbt build --project-dir transform --target dev`."
  stripe-rate-limit: "The Stripe extractor must stay under 25 requests per second. STRIPE_MAX_RPS defaults to 20; higher values cause 429s and a temporary account lockout."
  utc-partitions: "All timestamps are stored in UTC, and the dt partition key is the UTC date, not the Sydney business date."
  env-files: "Local secrets go in .env.local, which is gitignored. The committed .env holds only non-secret defaults."
  alert-channel: "Pipeline run failures post to the #tw-pipeline-alerts Slack channel through SLACK_WEBHOOK_URL. Nothing pages unless a run fails twice."
  pandera-contracts: "Every curated table needs a pandera schema in tidewater/schemas/. The CI step `make contracts` fails if one is missing."
  hubspot-cursor: "The HubSpot API paging cursor expires after 5 minutes, so a paused or retried HubSpot extract restarts from page one. Do not add sleeps inside the HubSpot paging loop."
  docker-platform: "On Apple Silicon, build the image with `docker build --platform linux/amd64` because the pinned Snowflake connector has no arm64 Linux wheel."
  backfill-concurrency: "The run worker pod has a 4Gi memory limit. Large backfills must pass `--max-concurrent 2` or the pods get OOMKilled."
  prod-ui: "The production Dagster UI is at https://dagster.tidewater.internal and needs the corporate VPN."
  schemachange: "Snowflake schema changes go through schemachange scripts in migrations/ named V<n>__<description>.sql. Never alter tables by hand."
  pre-commit: "pre-commit runs ruff, mypy --strict on tidewater/, and nbstripout, which blocks notebooks that still contain outputs."
  vendor-fixtures: "Vendor payload fixtures live in tests/fixtures/<source>/ and are regenerated with `make refresh-fixtures SOURCE=<name>`, which needs live API keys in .env.local."
  runbook: "The on-call rotation is the PagerDuty schedule 'Tidewater Data', and the incident runbook is docs/runbook.md."
